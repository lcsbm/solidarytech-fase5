# App-of-Apps: o unico recurso aplicado manualmente no cluster.
# A partir dele o ArgoCD assume a entrega continua de todo o resto.
#
#   kubectl apply -f gitops/bootstrap/app-of-apps.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/lcsbm/solidarytech-fase5.git
    targetRevision: main
    # Overlay Kustomize da producao: o ArgoCD detecta o kustomization.yaml.
    path: gitops/apps/overlays/prod

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
# Stack de observabilidade: Prometheus, Grafana, Loki e OTel Collector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/lcsbm/solidarytech-fase5.git
    targetRevision: main
    path: gitops/monitoring

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
