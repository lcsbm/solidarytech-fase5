apiVersion: v1
kind: Service
metadata:
  name: volunteer-service
  namespace: solidarytech
  labels:
    app: volunteer-service
spec:
  type: ClusterIP
  selector:
    app: volunteer-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volunteer-service
  namespace: solidarytech
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: volunteer-service
  namespaceSelector:
    matchNames:
      - solidarytech
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
