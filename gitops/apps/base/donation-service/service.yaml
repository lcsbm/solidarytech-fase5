apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: solidarytech
  labels:
    app: donation-service
spec:
  type: ClusterIP
  selector:
    app: donation-service
  ports:
    - name: http
      port: 8082
      targetPort: http
---
# Fonte das Golden Metrics que alimentam os SLOs do donation-service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: donation-service
  namespace: solidarytech
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: donation-service
  namespaceSelector:
    matchNames:
      - solidarytech
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
