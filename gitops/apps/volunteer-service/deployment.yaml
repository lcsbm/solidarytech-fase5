apiVersion: v1
kind: ServiceAccount
metadata:
  name: volunteer-service
  namespace: solidarytech
  annotations:
    # IRSA: acesso a tabela DynamoDB sem chaves estaticas no cluster.
    eks.amazonaws.com/role-arn: arn:aws:iam::603727984890:role/solidarytech-production-volunteer-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  namespace: solidarytech
  labels:
    app: volunteer-service
    app.kubernetes.io/part-of: solidarytech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: volunteer-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: volunteer-service
    spec:
      serviceAccountName: volunteer-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Carga nao-critica: roda em nos Spot (FinOps, ~65% mais barato).
      tolerations:
        - key: capacity-type
          operator: Equal
          value: spot
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values: ["burstable"]
      containers:
        - name: volunteer-service
          image: 603727984890.dkr.ecr.us-east-1.amazonaws.com/solidarytech/volunteer-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: volunteer-service-config
          # Rightsizing (FinOps): sem banco relacional, consumo de memoria menor.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
