apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-relay
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-relay
  namespace: monitoring
data:
  relay.py: |
    """
    Self-Healing Relay — recebe o webhook do Grafana e substitui os pods que
    nao estao Ready no servico alertado, direto pela API do Kubernetes.

    Sem credencial externa: usa o token do ServiceAccount projetado no pod
    (rotacionado pelo kubelet) com RBAC restrito a listar e remover pods no
    namespace da aplicacao. Pods saudaveis nao sao tocados; o Deployment
    recria os removidos. O servico vem do label `service` do alerta, validado
    contra uma allowlist.
    """
    import json
    import os
    import ssl
    import urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    NAMESPACE = os.environ.get("TARGET_NAMESPACE", "solidarytech")

    ALLOWED_SERVICES = {"ngo-service", "donation-service", "volunteer-service"}
    DEFAULT_SERVICE = "donation-service"

    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = "https://%s:%s" % (os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"])

    _ssl = ssl.create_default_context(cafile=f"{SA_DIR}/ca.crt")


    def _token():
        # Lido a cada chamada: o kubelet rotaciona o token projetado.
        with open(f"{SA_DIR}/token") as f:
            return f.read().strip()


    def _k8s(method, path):
        req = urllib.request.Request(API + path, method=method, headers={
            "Authorization": f"Bearer {_token()}",
            "Accept": "application/json",
        })
        with urllib.request.urlopen(req, context=_ssl, timeout=10) as resp:
            return json.load(resp)


    def extract_service(alert):
        labels = alert.get("commonLabels") or {}
        service = labels.get("service")
        if not service:
            for item in alert.get("alerts") or []:
                service = (item.get("labels") or {}).get("service")
                if service:
                    break
        service = service or DEFAULT_SERVICE
        if service not in ALLOWED_SERVICES:
            print(f"Servico '{service}' fora da allowlist — recusado.")
            return None
        return service


    def is_ready(pod):
        if pod["metadata"].get("deletionTimestamp"):
            return True  # ja esta saindo; nao mexer
        for cond in pod.get("status", {}).get("conditions") or []:
            if cond.get("type") == "Ready":
                return cond.get("status") == "True"
        return False


    def heal(service):
        pods = _k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/pods?labelSelector=app%3D{service}")["items"]
        broken = [p["metadata"]["name"] for p in pods if not is_ready(p)]
        if not broken:
            print(f"{service}: {len(pods)} pod(s), todos Ready — nada a fazer.")
            return 0
        for name in broken:
            _k8s("DELETE", f"/api/v1/namespaces/{NAMESPACE}/pods/{name}")
            print(f"{service}: pod {name} removido — o Deployment o recria.")
        return len(broken)


    class RelayHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            try:
                alert = json.loads(self.rfile.read(length))
            except json.JSONDecodeError as e:
                print(f"Payload invalido: {e}")
                self._respond(400)
                return

            status = alert.get("status", "unknown")
            print(f"Alerta recebido — status: {status}")
            # Sem este filtro, o alerta dispararia de novo ao ser resolvido.
            if status != "firing":
                self._respond(200)
                return

            service = extract_service(alert)
            if service is None:
                self._respond(403)
                return

            try:
                heal(service)
                self._respond(204)
            except Exception as e:
                print(f"Falha ao sanear {service}: {e}")
                self._respond(502)

        def do_GET(self):
            self._respond(200 if self.path == "/health" else 404)

        def _respond(self, code):
            self.send_response(code)
            self.end_headers()

        def log_message(self, fmt, *args):
            pass  # silencia o log padrao do BaseHTTPRequestHandler


    if __name__ == "__main__":
        port = int(os.environ.get("PORT", 8080))
        print(f"Self-healing relay ouvindo em :{port} (namespace alvo: {NAMESPACE})")
        HTTPServer(("", port), RelayHandler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-relay
  namespace: monitoring
  labels:
    app: self-healing-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-relay
  template:
    metadata:
      labels:
        app: self-healing-relay
      annotations:
        # Forca o rollout quando o script muda — sem isso o pod segue com a versao antiga.
        checksum/relay: "d844844f6d7004f4"
    spec:
      serviceAccountName: self-healing-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        # fsGroup garante leitura do token projetado do ServiceAccount.
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: python:3.12-alpine
          command: ["python", "/app/relay.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TARGET_NAMESPACE
              value: solidarytech
          volumeMounts:
            - name: script
              mountPath: /app
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: self-healing-relay
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing-relay
  namespace: monitoring
spec:
  selector:
    app: self-healing-relay
  ports:
    - port: 80
      targetPort: http
