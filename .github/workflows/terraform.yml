name: Terraform — Plan e Apply

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        default: prod
        type: choice
        options: [prod, dr, registry]
      action:
        description: 'Acao a executar'
        required: true
        default: plan
        type: choice
        options: [plan, apply]

env:
  TF_VERSION: '1.13.3'
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [prod, dr, registry]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verifica formatacao
        run: terraform fmt -check -recursive terraform/

      - name: Init (sem backend)
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: terraform/envs/${{ matrix.env }}
        run: terraform validate

  # Verifica que a politica de tags FinOps nao foi burlada:
  # todo ambiente precisa declarar default_tags com as 4 tags obrigatorias.
  finops-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valida tags obrigatorias nos ambientes
        run: |
          FALHOU=0
          for env_dir in terraform/envs/*/; do
            env_name=$(basename "$env_dir")
            for tag in Project Environment CostCenter ManagedBy; do
              if ! grep -q "$tag" "$env_dir/main.tf"; then
                echo "::error::Ambiente '$env_name' nao declara a tag FinOps obrigatoria: $tag"
                FALHOU=1
              fi
            done
          done
          if [ "$FALHOU" -eq 0 ]; then
            echo "Todos os ambientes declaram as 4 tags FinOps obrigatorias."
          fi
          exit "$FALHOU"

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — misconfiguration no IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy-terraform.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Publica resultado no GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-terraform.sarif
          category: trivy-terraform

  plan:
    needs: [validate, finops-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TARGET_ENV: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::603727984890:role/SolidaryTech-CICD-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: terraform/envs/${{ env.TARGET_ENV }}
        run: terraform init -input=false

      - name: Plan
        working-directory: terraform/envs/${{ env.TARGET_ENV }}
        run: |
          terraform plan -input=false -no-color \
            -var="eks_admin_iam_arn=${{ secrets.EKS_ADMIN_IAM_ARN }}" \
            -out=tfplan 2>&1 | tee plan.txt

      - name: Comenta o plan no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              `terraform/envs/${process.env.TARGET_ENV}/plan.txt`, 'utf8'
            );
            const body = [
              `### Terraform Plan — \`${process.env.TARGET_ENV}\``,
              '',
              '<details><summary>Ver plan completo</summary>',
              '',
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncado)' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # Apply nunca roda automaticamente: exige disparo manual e aprovacao
  # do environment protegido no GitHub.
  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::603727984890:role/SolidaryTech-CICD-terraform
          aws-region: ${{ env.AWS_REGION }}
          # Sessao de 2h: o apply pode passar de 1h em retries do EKS.
          role-duration-seconds: 7200

      - name: Init
        working-directory: terraform/envs/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Apply
        working-directory: terraform/envs/${{ inputs.environment }}
        run: |
          terraform apply -input=false -auto-approve \
            -var="eks_admin_iam_arn=${{ secrets.EKS_ADMIN_IAM_ARN }}"
